events {}

http {
    server {
        listen 80;

        # Frontend (React/Vite dev server)
        location / {
            proxy_pass http://frontend:5173;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade"; # needed for Vite's hot-reload websocket
        }

        # Backend (Spring Boot) — anything under /api/
        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_set_header Host $host;
        }

        # AI service (FastAPI) — anything under /ai/
        # Note: strips the /ai prefix, so /ai/summarize -> http://ai-service:8000/summarize
        location /ai/ {
            proxy_pass http://ai-service:8000/;
            proxy_set_header Host $host;
        }
    }
}
