server:
  port: 8080

spring:
  application:
    name: smart-notes-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_notes
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-change-me-please-32chars+}
    expiration-ms: 86400000 # 24 hours

  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
